name: Copy existing releases (no builds)
on:
  workflow_dispatch:
    inputs:
      source:
        description: Public source repository
        type: choice
        options: [inane-tools/cherry-electron, inane-tools/cherry, inane-tools/cherry-tauri]
        required: true
      tag:
        description: Existing tag, latest, or all
        type: string
        required: true
      tauri_compatibility:
        description: Add the pinned Tauri updater manifest to the copied Electron release
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: copy-existing-releases
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Copy and verify published assets
        run: node scripts/copy-github-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          COPY_SOURCE_REPO: ${{ inputs.source }}
          COPY_RELEASE_TAG: ${{ inputs.tag }}
          COPY_INCLUDE_TAURI_MANIFEST: ${{ inputs.tauri_compatibility }}
