name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  installers:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --bundles nsis
          - os: ubuntu-24.04
            name: linux-x64
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}-release
          cache-on-failure: true
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf flatpak flatpak-builder gnome-keyring dbus-x11
      - run: npm ci
      - name: Build frontend for Rust context
        run: npm run build
        env:
          TAURI_ENV_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Rust tests
        if: runner.os != 'Linux'
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust tests with isolated Linux keyring
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="$(mktemp -d)"
            printf "%s" "cherry-ci-test-password" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --release --locked --manifest-path src-tauri/Cargo.toml
          '
      - name: Build signed installers
        if: github.event_name != 'pull_request'
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json ${{ matrix.args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Build unsigned PR validation installers
        if: github.event_name == 'pull_request'
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json --config src-tauri/tauri.unsigned.conf.json ${{ matrix.args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Build self-distributed Flatpak
        if: runner.os == 'Linux'
        run: bash packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cherry-${{ matrix.name }}
          if-no-files-found: error
          # Installers are already compressed; ZIP compression adds CPU time.
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            packaging/flatpak/out/*.flatpak
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  updater-metadata:
    if: github.event_name != 'pull_request'
    needs: installers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: cherry-*
          path: installers
      - run: node scripts/updater-manifest.mjs installers latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: cherry-updater
          path: latest.json
          if-no-files-found: error
